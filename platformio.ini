; M5Stack Stamp-C3 joystick: two independently uploadable firmwares.
;
;   joystick_test   raw readings and calibration over USB serial, no Bluetooth
;   joystick_light  joystick -> BLE light strip (reuses the stored calibration)
;
; Build/upload/monitor commands are in README.md.

[platformio]
default_envs = joystick_test
; Optional, untracked: e.g. a fixed upload_port / monitor_port for this machine.
extra_configs = platformio.local.ini

[env]
; Pinned: Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4.7).
platform = platformio/espressif32@6.12.0
framework = arduino
; PlatformIO has no Stamp-C3 board. The Stamp-C3 is an ESP32-C3 with 4 MB of
; in-package flash, which is what this definition describes.
board = esp32-c3-devkitm-1
; The Stamp-C3 reaches USB through a CH9102 bridge on UART0 (GPIO20/21), so
; Serial must be the UART, not native USB CDC. (A Stamp-C3U has no bridge and
; would need -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 instead.)
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Lets lib/joynet see include/credentials.h (libraries do not get it by default).
    -Iinclude
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DJOY_PIN_VRX=0
    -DJOY_PIN_VRY=1
    -DJOY_PIN_SW=10
build_src_flags = -Wall -Wextra
; Wi-Fi updates: give an IP address as --upload-port instead of a COM port.
; Needs include/credentials.h (see include/credentials.example.h).
extra_scripts =
    pre:tools/pio_ota.py
    post:tools/pio_ota.py
upload_speed = 460800
monitor_speed = 115200
; Type a command, press Enter, and see what you typed.
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

[env:joystick_test]
build_src_filter = +<joystick_test/>

[env:joystick_light]
build_src_filter = +<joystick_light/>
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    ${env.build_flags}
    ; Central only: no advertising or GATT server code is needed.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    ; Tuning: how fast a FULL tilt changes the light. Partial tilts are slower
    ; (squared response: half tilt = a quarter of these speeds).
    -DLIGHT_HUE_RATE_DEG_PER_SEC=90
    -DLIGHT_BRIGHTNESS_RATE_PCT_PER_SEC=100
    ; Target strip. REPLACE THIS with the Bluetooth address of YOUR strip: the
    ; value below is the author's and will not match any other device. See
    ; "Using your own strip" in README.md for how to find it. Lower or upper
    ; case both work. The firmware reads the address type (public/random) from
    ; the strip's own advertisement, so only the address is needed.
    '-DLIGHT_ADDRESS="90:00:00:32:a9:9d"'
